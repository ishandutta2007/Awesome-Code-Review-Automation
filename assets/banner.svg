<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #8b949e; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
      .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
      .flow-line { stroke-dasharray: 8, 8; animation: flow 20s linear infinite; }
      .card-float { animation: float 6s ease-in-out infinite alternate; }
      .card-float-delayed { animation: float 6s ease-in-out infinite alternate; animation-delay: -3s; }

      @keyframes pulse {
        0% { r: 6px; opacity: 0.6; }
        100% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #58a6ff); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Subtle Animated Grid Pattern & Circuits -->
  <g opacity="0.15">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 300,0 L 300,320 M 600,0 L 600,320 M 900,0 L 900,320" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Flow Circuit Line connecting CI to PR review -->
  <path class="flow-line" d="M 80,260 C 250,260 200,160 420,160 C 600,160 650,260 850,260 C 1000,260 1020,140 1120,140" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4"/>

  <!-- Left/Center Hero Content -->
  <g transform="translate(70, 75)">
    <!-- Top Micro Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1f293d" stroke="#388bfd" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#3fb950" class="pulse-circle" />
    <text x="28" y="19" class="badge-text" fill="#58a6ff">⚡ AUTOMATED CODE REVIEW</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">
      Awesome <tspan fill="url(#accentGrad)">Code Review</tspan> Automation
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" class="subtitle">
      Curated Ecosystem of AI Pull Request Reviewers, Static Analyzers &amp; Quality Gates
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="14" y="20" class="badge-text" fill="#c9d1d9">🤖 AI Reviewers</text>
      <!-- Pill 2 -->
      <rect x="142" y="0" width="140" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="156" y="20" class="badge-text" fill="#c9d1d9">🛡️ Static Analysis</text>
      <!-- Pill 3 -->
      <rect x="294" y="0" width="140" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="308" y="20" class="badge-text" fill="#c9d1d9">🚀 Quality Gates</text>
      <!-- Pill 4 -->
      <rect x="446" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="460" y="20" class="badge-text" fill="#c9d1d9">🌐 SaaS &amp; OSS</text>
    </g>
  </g>

  <!-- Right Visual Cards (Dynamic Floating Simulation) -->
  <g class="card-float" transform="translate(850, 45)" filter="url(#cardShadow)">
    <rect width="280" height="100" rx="10" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.2"/>
    <!-- Card 1 Header -->
    <circle cx="20" cy="22" r="6" fill="#f85149"/>
    <circle cx="36" cy="22" r="6" fill="#e3b341"/>
    <circle cx="52" cy="22" r="6" fill="#238636"/>
    <text x="70" y="26" class="badge-text" fill="#8b949e">PR #1024 • AI Bot</text>
    
    <!-- Review Status -->
    <rect x="18" y="44" width="244" height="22" rx="4" fill="#1f293d"/>
    <text x="26" y="59" class="badge-text" fill="#3fb950">✓ 0 Bugs Found  •  +15% Performance</text>
    
    <text x="18" y="86" class="badge-text" fill="#58a6ff">💬 "Security &amp; syntax verified in CI"</text>
  </g>

  <g class="card-float-delayed" transform="translate(890, 165)" filter="url(#cardShadow)">
    <rect width="250" height="90" rx="10" fill="url(#cardGrad)" stroke="#bc8cff" stroke-width="1.2"/>
    <text x="18" y="28" class="badge-text" fill="#bc8cff">⚡ Quality Gate Status</text>
    <rect x="18" y="40" width="214" height="6" rx="3" fill="#21262d"/>
    <rect x="18" y="40" width="180" height="6" rx="3" fill="url(#accentGrad)"/>
    <text x="18" y="68" class="badge-text" fill="#c9d1d9">Status: <tspan fill="#3fb950" font-weight="bold">PASSED (98.4%)</tspan></text>
  </g>
</svg>
